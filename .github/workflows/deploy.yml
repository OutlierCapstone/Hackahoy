name: deploy-desktop-demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-desktop-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, hackahoy-demo]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, start, and verify the private Tailscale demo
        shell: powershell
        run: .\scripts\desktop-deploy.ps1
