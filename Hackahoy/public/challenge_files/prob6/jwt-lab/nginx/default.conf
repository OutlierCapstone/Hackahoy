server {
  listen 80;

  location /img/ {
    root /usr/share/nginx/html;
  }

  location /api/ {
    proxy_pass http://backend:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth/ {
    proxy_pass http://backend:5000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 정답 경로. frontend/public/main.js 가 fetch("/admin") 으로 호출하고
  # backend/routes/admin.js 의 adminRouter.get("/") 가 응답한다.
  #
  # 이 블록이 없으면 /admin 이 아래 location / 의 try_files 로 떨어져
  # index.html 이 200 으로 반환된다. 그러면 res.json() 이 실패해서
  # 플래그가 표시되지 않고, 학습자는 백엔드 포트를 직접 부르는 수밖에 없다.
  # 백엔드를 직접 부르면 리버스 프록시를 우회하므로 학습 로그도 수집되지 않는다.
  location /admin {
    proxy_pass http://backend:5000/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}