server {
  listen 80;

  location /img/ {
    root /usr/share/nginx/html;
  }

  location /api/ {
    proxy_pass http://backend:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth/ {
    proxy_pass http://backend:5000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # main.js 는 fetch("/admin") 을 호출한다(대시보드에서 플래그를 띄우는 부분).
  # 이 블록이 없으면 아래 location / 의 try_files 에 걸려 index.html 이 돌아가고,
  # res.json() 이 실패해 catch 로 빠진다. 그래서 화면에는 아무것도 안 뜨고
  # /api/admin 을 직접 호출해야만 풀렸다.
  # 백엔드는 app.use("/admin", adminRoutes) 로 이미 이 경로를 노출하고 있다.
  location /admin {
    proxy_pass http://backend:5000/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}