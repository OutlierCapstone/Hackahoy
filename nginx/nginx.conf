worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    resolver 127.0.0.11 ipv6=off valid=30s;

    map $server_port $upstream_port {
        5001  3001;
        5002  3002;
        5003  3003;
        5004  3004;
        5005  3005;
        5006  3006;
        5007  3007;
        default 3001;
    }

    map $server_port $prob_id {
        5001  1;
        5002  2;
        5003  3;
        5004  4;
        5005  5;
        5006  6;
        5007  7;
        default 0;
    }

    server {
        listen 5001;
        listen 5002;
        listen 5003;
        listen 5004;
        listen 5005;
        listen 5006;
        listen 5007;

        location /set-uid {
            set $upstream "";
            access_by_lua_block {
                ngx.var.upstream = "http://172.17.0.1:" .. ngx.var.upstream_port

                local args = ngx.req.get_uri_args()
                local uid = args["uid"]
                if uid and uid ~= "" then
                    ngx.header["Set-Cookie"] = "uid=" .. uid .. "; Path=/; HttpOnly"
                end
                return ngx.redirect("/")
            }
            proxy_pass $upstream;
        }

        location / {
            lua_need_request_body on;

            set $upstream "";

            access_by_lua_block {
                local uri    = ngx.var.request_uri
                local method = ngx.req.get_method()

                ngx.var.upstream = "http://172.17.0.1:" .. ngx.var.upstream_port

                -- 사용자 식별
                local raw_headers = ngx.req.get_headers()
                local user_id = "anonymous"
                local auth = raw_headers["authorization"]
                if auth then
                    user_id = auth:gsub("^Bearer%s+", "")
                else
                    local cookie_uid = ngx.var.cookie_uid
                    if cookie_uid and cookie_uid ~= "" then
                        user_id = cookie_uid
                    end
                end

                -- 정적 자원 / 프레임워크 내부 요청 제외
                local is_asset =
                    uri:find("%.ico$") or uri:find("%.js$")
                    or uri:find("%.css$") or uri:find("%.png$")
                    or uri:find("%.jpg$") or uri:find("%.jpeg$")
                    or uri:find("%.PNG$") or uri:find("%.gif$")
                    or uri:find("%.webp$") or uri:find("%.woff")
                    or uri:find("%.svg$") or uri:find("%.map$")
                    or uri:find("_next/")
                    or uri:find("_rsc=")
                    or uri:find("webpack")
                    or uri:find("missions")
                    or uri:find("/img/") or uri:find("__nextjs")

                if is_asset then
                    ngx.ctx.skip_collect = true
                    return
                end

                -- GET 은 쿼리스트링이 있을 때만 수집한다.
                -- (단순 페이지 이동은 노이즈, 파라미터가 붙은 GET 은 공격 시도일 수 있음)
                if method == "GET" then
                    local args = ngx.var.args
                    if not args or args == "" then
                        ngx.ctx.skip_collect = true
                        return
                    end
                end

                -- 요청 바디는 log 단계에서 읽을 수 없으므로 여기서 확보해 둔다
                ngx.req.read_body()
                local req_body = ngx.req.get_body_data()
                if not req_body then
                    local body_file = ngx.req.get_body_file()
                    if body_file then
                        local f = io.open(body_file, "rb")
                        if f then
                            req_body = f:read("*all")
                            f:close()
                        end
                    end
                end

                ngx.ctx.collect = {
                    user_id    = user_id,
                    problem_id = tonumber(ngx.var.prob_id) or 0,
                    method     = method,
                    uri        = uri,
                    query      = ngx.var.args or "",
                    payload    = req_body or "",
                }
            }

            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            log_by_lua_block {
                if ngx.ctx.skip_collect or not ngx.ctx.collect then
                    return
                end

                local data = ngx.ctx.collect

                -- 여기서만 얻을 수 있는 응답 정보
                data.status     = ngx.status
                data.resp_bytes = tonumber(ngx.var.body_bytes_sent) or 0
                data.elapsed_ms = math.floor((tonumber(ngx.var.request_time) or 0) * 1000)

                -- log 단계에서는 cosocket 을 쓸 수 없으므로 타이머로 넘겨 비동기 전송한다.
                -- 응답은 이미 사용자에게 나갔으므로 체감 지연이 없다.
                local ok, err = ngx.timer.at(0, function(premature, payload)
                    if premature then return end

                    local http  = require "resty.http"
                    local cjson = require "cjson"
                    local hc = http.new()
                    hc:set_timeout(3000)

                    local ok2, err2 = pcall(function()
                        hc:request_uri("http://172.17.0.1:4000/api/collect", {
                            method  = "POST",
                            body    = cjson.encode(payload),
                            headers = { ["Content-Type"] = "application/json" }
                        })
                    end)

                    if not ok2 then
                        ngx.log(ngx.ERR, "collect error: ", err2)
                    end
                end, data)

                if not ok then
                    ngx.log(ngx.ERR, "collect timer failed: ", err)
                end
            }
        }
    }
}
