worker_processes 1;

# Lua 에서 os.getenv 로 읽기 위한 선언
env HOST_GATEWAY;
env COLLECT_DEBUG;

# 진단용. docker compose logs openresty 로 바로 보인다.
# COLLECT_DEBUG=1 이면 "수집을 건너뛴 이유"까지 여기에 찍힌다.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # 설정을 모듈 테이블로 올려 둔다.
    # (요청 단계에서 전역 변수를 읽고 쓰면 OpenResty 가 경고하므로 package.loaded 사용)
    init_by_lua_block {
        local cfg = {}

        -- 반드시 IP 여야 한다.
        -- proxy_pass $upstream 과 resty.http 는 둘 다 resolver(127.0.0.11) 를 타기 때문에
        -- /etc/hosts 에만 존재하는 host.docker.internal 은 해석되지 않는다.
        cfg.host_gateway = os.getenv("HOST_GATEWAY") or "172.17.0.1"
        cfg.collect_url  = "http://" .. cfg.host_gateway .. ":4000/api/collect"
        cfg.debug        = (os.getenv("COLLECT_DEBUG") == "1")

        -- 수집할 요청 바디 상한.
        -- 힌트 파이프라인은 페이로드를 200자로 잘라 쓰므로 그 이상은 의미가 없고,
        -- 문제 7 처럼 이미지를 업로드하는 문제에서 수 MB 를 그대로 실어 보내면
        -- 메모리와 UserLog.body 가 낭비된다.
        cfg.max_payload = 2048

        -- 진짜 정적 자원만 넣는다.
        -- html / json 은 절대 넣지 않는다: /profile.html?id=2 처럼 그 자체가 공격 대상이다.
        cfg.asset_ext = {
            ico = true, css = true, js = true, mjs = true, map = true,
            png = true, jpg = true, jpeg = true, gif = true, webp = true,
            svg = true, bmp = true, avif = true,
            woff = true, woff2 = true, ttf = true, eot = true,
        }

        package.loaded["collect_cfg"] = cfg
    }

    # 챌린지 서버 업스트림 포트.
    # 문제를 추가하면 이 map 과 아래 prob_id map, listen 세 곳을 함께 고쳐야 한다.
    map $server_port $upstream_port {
        5001  3001;
        5002  3002;
        5003  3003;
        5004  3004;
        5005  3005;
        5006  3006;
        5007  3007;
        default 3001;
    }

    # 리스닝 포트 -> 문제 번호.
    # 0 이 나오면 매핑 누락이며, 아래 Lua 에서 error 로그를 남긴다.
    map $server_port $prob_id {
        5001  1;
        5002  2;
        5003  3;
        5004  4;
        5005  5;
        5006  6;
        5007  7;
        default 0;
    }

    server {
        listen 5001;
        listen 5002;
        listen 5003;
        listen 5004;
        listen 5005;
        listen 5006;
        listen 5007;

        location /set-uid {
            set $upstream "";
            access_by_lua_block {
                local cfg = require "collect_cfg"
                ngx.var.upstream = "http://" .. cfg.host_gateway .. ":" .. ngx.var.upstream_port

                local args = ngx.req.get_uri_args()
                local uid = args["uid"]
                if uid and uid ~= "" then
                    -- SameSite=Lax: 플랫폼에서 링크 클릭(top-level GET)으로 넘어올 때는 전달된다.
                    ngx.header["Set-Cookie"] = "uid=" .. uid .. "; Path=/; HttpOnly; SameSite=Lax"
                    if cfg.debug then
                        ngx.log(ngx.WARN, "[collect] set-uid uid=", uid,
                                          " port=", ngx.var.server_port)
                    end
                else
                    ngx.log(ngx.WARN, "[collect] set-uid 에 uid 파라미터가 없다. ",
                                      "이후 모든 요청이 anonymous 로 폐기된다.")
                end
                return ngx.redirect("/")
            }
            proxy_pass $upstream;
        }

        # 문제 7 은 이미지를 업로드한다. nginx 기본값(1m)이면 413 으로 막힌다.
        client_max_body_size 20m;

        location / {
            # lua_need_request_body 를 켜지 않는다.
            # 그 지시어는 모든 요청의 바디를 통째로 메모리에 읽는데,
            # 이미지 업로드가 있는 문제에서 낭비가 크다.
            # 아래에서 필요한 경우에만 ngx.req.read_body() 를 직접 호출한다.

            set $upstream "";

            access_by_lua_block {
                local cfg = require "collect_cfg"

                local path   = ngx.var.uri          -- 정규화/디코딩된 경로 (쿼리 제외)
                local uri    = ngx.var.request_uri  -- 원본 전체 (수집용)
                local args   = ngx.var.args
                local method = ngx.req.get_method()

                ngx.var.upstream = "http://" .. cfg.host_gateway .. ":" .. ngx.var.upstream_port

                -- 사용자 식별
                local user_id = "anonymous"
                local auth = ngx.req.get_headers()["authorization"]
                if auth then
                    user_id = auth:gsub("^Bearer%s+", "")
                else
                    local cookie_uid = ngx.var.cookie_uid
                    if cookie_uid and cookie_uid ~= "" then
                        user_id = cookie_uid
                    end
                end

                -- (1) 정적 자원 제외.
                --     반드시 path 만 검사한다. request_uri(쿼리 포함)로 부분 문자열을 찾으면
                --     ?file=/img/a.png 같은 페이로드까지 자산으로 오인해서 버린다.
                local ext = path:match("%.(%w+)$")
                if ext and cfg.asset_ext[ext:lower()] then
                    ngx.ctx.skip_collect = "asset:" .. ext
                    return
                end

                -- (2) Next.js 내부 요청 제외. 접두어로 고정한다.
                --     예전에는 "webpack", "missions" 같은 부분 문자열을 찾았는데,
                --     그 결과 문제 2 의 정답 경로 /api/missions?userId=... 가 통째로 버려졌다.
                if path:find("^/_next/") or path:find("^/__nextjs") then
                    ngx.ctx.skip_collect = "next_internal"
                    return
                end
                if args and args:find("_rsc=", 1, true) then
                    ngx.ctx.skip_collect = "next_rsc"
                    return
                end

                -- (3) 루트 페이지 단순 진입만 제외한다.
                --     예전에는 "쿼리 없는 GET" 을 전부 버렸다. 그러면
                --     GET /admin (문제 6 정답 경로), GET /api/user/2 같은
                --     경로 기반 공격이 로그에서 완전히 사라진다.
                if path == "/" and (not args or args == "") then
                    ngx.ctx.skip_collect = "root_nav"
                    return
                end

                -- 문제 번호 매핑 확인. 0 이면 백엔드에서 FK 위반으로 유실된다.
                local prob_id = tonumber(ngx.var.prob_id) or 0
                if prob_id == 0 then
                    ngx.log(ngx.ERR, "[collect] prob_id 매핑 없음 port=", ngx.var.server_port,
                                     " uri=", uri, " (nginx.conf 의 prob_id map 확인)")
                end

                -- uid 가 없으면 백엔드가 조용히 버린다. 원인을 여기서 남겨 둔다.
                if user_id == "anonymous" then
                    ngx.log(ngx.WARN, "[collect] uid 없음 -> 백엔드에서 폐기된다. ",
                                      "/set-uid 를 거치지 않았거나 다른 오리진으로 접속한 경우다. uri=", uri)
                end

                -- 요청 바디는 log 단계에서 읽을 수 없으므로 여기서 확보해 둔다.
                local ctype = ngx.req.get_headers()["content-type"] or ""
                local req_body = ""

                if ctype:find("multipart/form-data", 1, true) then
                    -- 파일 업로드(문제 7)는 바이너리라 그대로 실을 가치가 없다.
                    -- 크기만 기록해도 "업로드를 시도했다" 는 신호는 남는다.
                    local clen = tonumber(ngx.var.content_length) or 0
                    req_body = "[multipart upload " .. clen .. " bytes]"
                else
                    ngx.req.read_body()
                    req_body = ngx.req.get_body_data()
                    if not req_body then
                        local body_file = ngx.req.get_body_file()
                        if body_file then
                            local f = io.open(body_file, "rb")
                            if f then
                                req_body = f:read(cfg.max_payload + 1) or ""
                                f:close()
                            end
                        end
                    end
                    req_body = req_body or ""
                    if #req_body > cfg.max_payload then
                        req_body = req_body:sub(1, cfg.max_payload) .. "...[truncated]"
                    end
                end

                ngx.ctx.collect = {
                    user_id    = user_id,
                    problem_id = prob_id,
                    method     = method,
                    uri        = uri,
                    query      = args or "",
                    payload    = req_body,
                }
            }

            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            log_by_lua_block {
                local cfg = require "collect_cfg"

                local skip = ngx.ctx.skip_collect
                if skip then
                    if cfg.debug then
                        ngx.log(ngx.WARN, "[collect] SKIP reason=", skip, " ",
                                          ngx.var.request_method, " ", ngx.var.request_uri)
                    end
                    return
                end

                if not ngx.ctx.collect then
                    ngx.log(ngx.WARN, "[collect] ctx 없음. access 단계가 실행되지 않았다. ",
                                      ngx.var.request_method, " ", ngx.var.request_uri)
                    return
                end

                local data = ngx.ctx.collect

                -- 여기서만 얻을 수 있는 응답 정보
                data.status     = ngx.status
                data.resp_bytes = tonumber(ngx.var.body_bytes_sent) or 0
                data.elapsed_ms = math.floor((tonumber(ngx.var.request_time) or 0) * 1000)

                -- log 단계에서는 cosocket 을 쓸 수 없으므로 타이머로 넘겨 비동기 전송한다.
                -- 응답은 이미 사용자에게 나갔으므로 체감 지연이 없다.
                local ok, err = ngx.timer.at(0, function(premature, payload)
                    if premature then return end

                    local c     = require "collect_cfg"
                    local http  = require "resty.http"
                    local cjson = require "cjson"

                    local hc = http.new()
                    hc:set_timeout(3000)

                    -- pcall 로 감싸 결과를 버리지 않는다.
                    -- 예전 코드는 전송 실패와 백엔드 거부가 모두 조용히 사라졌다.
                    local res, rerr = hc:request_uri(c.collect_url, {
                        method  = "POST",
                        body    = cjson.encode(payload),
                        headers = { ["Content-Type"] = "application/json" }
                    })

                    if not res then
                        ngx.log(ngx.ERR, "[collect] 전송 실패 url=", c.collect_url,
                                         " err=", tostring(rerr),
                                         " (컨테이너에서 호스트 4000 포트에 닿는지 확인)")
                        return
                    end

                    if res.status < 200 or res.status >= 300 then
                        ngx.log(ngx.ERR, "[collect] 백엔드 HTTP ", res.status,
                                         " body=", tostring(res.body))
                        return
                    end

                    -- 백엔드는 거부할 때도 HTTP 200 에 success:false 를 담아 준다.
                    -- (uid 없음, problemId 이상, FK 위반 등) 이걸 확인하지 않으면 유실이 안 보인다.
                    local body = res.body or ""
                    if body:find('"success"%s*:%s*false') then
                        ngx.log(ngx.WARN, "[collect] 백엔드 거부: ", body,
                                          " | user=", tostring(payload.user_id),
                                          " prob=", tostring(payload.problem_id),
                                          " uri=", tostring(payload.uri))
                        return
                    end

                    if c.debug then
                        ngx.log(ngx.WARN, "[collect] OK ", tostring(payload.method), " ",
                                          tostring(payload.uri),
                                          " status=", tostring(payload.status))
                    end
                end, data)

                if not ok then
                    ngx.log(ngx.ERR, "[collect] timer 생성 실패: ", tostring(err))
                end
            }
        }
    }
}
